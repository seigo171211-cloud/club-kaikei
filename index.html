<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="robots" content="noindex,nofollow">
<title>部活会計管理</title>
<style>
:root{
  --accent:#e32636; --accent2:#b71324; --accent3:#ff4b5b;
  --bg:#08090b; --surface:#101216; --surface2:#15181d; --surface3:#1b1f26;
  --line:#292e36; --line2:#353b45; --text:#f4f5f7; --muted:#969ca6;
  --success:#54d17a; --warning:#e7b84a; --danger:#f05b67;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}
body.light{
  --bg:#f2f3f5; --surface:#fff; --surface2:#f7f7f8; --surface3:#eceef1;
  --line:#e1e3e7; --line2:#cfd3d9; --text:#17191d; --muted:#69707b;
  --shadow:0 14px 35px rgba(20,25,35,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.appbar{
  height:72px;background:rgba(8,9,11,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid #ffffff12;display:flex;align-items:center;padding:env(safe-area-inset-top) 26px 0;
  box-sizing:border-box;position:sticky;top:0;z-index:50
}
body.light .appbar{background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.menuBtn{width:42px;height:42px;border:0;background:transparent;color:var(--text);
  font-size:23px;border-radius:9px}
.menuBtn:hover{background:var(--surface3)}
.brand{font-size:19px;font-weight:700;letter-spacing:.04em;margin-left:10px}
.brand::before{content:"";display:inline-block;width:7px;height:22px;border-radius:5px;
  background:var(--accent);margin-right:10px;vertical-align:-5px}
.app-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.app-actions button{border:1px solid var(--line2);background:var(--surface2);color:var(--text);
  height:40px;min-width:40px;padding:0 11px;border-radius:9px}
.app-actions button:hover{border-color:var(--accent);color:var(--accent)}
.app-actions button{display:inline-flex;align-items:center;justify-content:center}
.year-select{height:40px;min-width:112px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);color:var(--text);padding:0 9px}
.year-add{height:40px!important;white-space:nowrap}
.year-dialog{border:1px solid var(--line2);border-radius:14px;background:var(--surface);color:var(--text);padding:20px;width:min(360px,calc(100vw - 32px));box-shadow:0 20px 60px #0008}
.year-dialog::backdrop{background:#0008}
.year-dialog h3{margin:0 0 8px}.year-dialog form{display:grid;gap:12px}.year-dialog select{height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);color:var(--text);padding:0 10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.mobile-settings{display:none}
.user-chip{border-radius:20px!important;padding:0 14px!important}
.layout{display:flex;min-height:calc(100vh - 72px)}
.sidebar{
  width:238px;background:var(--surface);border-right:1px solid var(--line);
  padding:18px 11px;position:sticky;top:72px;height:calc(100vh - 72px)
}
.nav-title{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.12em;padding:14px 13px 8px}
.nav-btn{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;
  padding:11px 13px;border-radius:9px;display:flex;gap:12px;align-items:center;margin:3px 0}
.nav-btn:hover{background:var(--surface3);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(227,38,54,.18)}
.nav-icon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.nav-icon svg,.mi svg,.head-icon svg,.kpi-icon svg,.menuBtn svg,.app-actions button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;max-width:1500px;margin:0 auto;padding:30px 32px 54px;width:100%}
.notice{
  border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:15px 17px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start
}
.notice.accent{border-color:#6c1e28;background:linear-gradient(135deg,#170c0f,var(--surface))}
body.light .notice.accent{background:#fff4f5;border-color:#f0c8cd}
.notice-icon{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;
  background:var(--accent);color:#fff;flex:none}
.notice-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.notice b{font-size:13px}.notice .muted{font-size:12px;line-height:1.65}
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:26px 0 17px
}
.hero h1{margin:0;font-size:27px;letter-spacing:.01em}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:5fr 7fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.balance{padding:25px;min-height:215px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;
  right:-70px;top:-75px;background:radial-gradient(circle,#e3263640,transparent 68%)}
.balance-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.balance-num{font-size:42px;font-weight:800;letter-spacing:-.02em;margin:12px 0 5px}
.balance-sub{color:var(--muted);font-size:12px;line-height:1.7}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.statbox{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:19px;min-height:120px}
.kpi-icon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;
  color:var(--accent);background:rgba(227,38,54,.1);margin-bottom:13px}
.statbox .num{font-size:23px;font-weight:750;margin-top:8px}
.muted{color:var(--muted)}
.section{margin-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.section-head h2{font-size:17px;margin:0;font-weight:750}
.btn{
  border:1px solid var(--line2);border-radius:9px;padding:10px 14px;background:var(--surface2);
  color:var(--text);transition:.15s ease
}
.btn:hover{transform:translateY(-1px);border-color:#555}
.btn.green{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.green:hover{background:var(--accent3);border-color:var(--accent3)}
.btn.outline{background:transparent}
.btn.danger{background:#351217;border-color:#64212a;color:#ff8d97}
body.light .btn.danger{background:#fff0f1;color:#b71324;border-color:#f0c6cb}
.btn.small{padding:7px 10px;font-size:12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:700px;background:var(--surface)}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{background:var(--surface2);color:var(--muted);font-size:11px;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
.amount{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.positive{color:var(--success)}.negative{color:#ff737e}
.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:var(--surface3);color:var(--muted);font-size:11px}
.badge.green{background:#12301c;color:#70e492}.badge.yellow{background:#332b12;color:#f3cb62}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}
.tab{background:transparent;border:0;color:var(--muted);padding:10px 14px;white-space:nowrap;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.collection-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.summary-pill{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:7px 11px;font-size:12px}
.check{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);
  color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.check.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.member-name{font-weight:650}.member-meta{font-size:11px;color:var(--muted);margin-top:3px}
.member-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.member-row-info{min-width:0;flex:1}
.member-delete{flex:none;min-width:64px;min-height:38px;padding:8px 12px!important;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.event-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.event-select{min-width:220px;max-width:100%;height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--surface2);color:var(--text);padding:0 10px}
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--surface)}
.matrix th:first-child{background:var(--surface2);z-index:3}
.matrix input{width:105px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--text);padding:8px;text-align:right}
.matrix input:focus{outline:2px solid #e3263638;border-color:var(--accent)}
.matrix .total{font-weight:750;color:var(--text)}
.member-admin{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea,.member-admin input{
  background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:10px 11px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus,.member-admin input:focus{border-color:var(--accent);outline:2px solid #e326361f}
.empty{padding:40px 25px;text-align:center;color:var(--muted);line-height:1.8}
.note{font-size:11px;color:var(--muted);line-height:1.7}
.card.pad{padding:20px}
.hidden{display:none!important}
.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-back.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:13px;width:min(680px,100%);
  max-height:90vh;overflow:auto;box-shadow:0 25px 80px #000b}
.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:16px}.modal-body{padding:20px}.modal-foot{padding:14px 19px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.close{background:transparent;border:0;color:var(--muted);font-size:24px;width:35px;height:35px;border-radius:8px}.close:hover{background:var(--surface3);color:var(--text)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.modal-tip{border-left:3px solid var(--accent);background:var(--surface2);padding:10px 12px;border-radius:6px;color:var(--muted);font-size:12px;margin-top:13px}
.mobile-bottom{display:none}
.side-back{display:none}
@media(max-width:900px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  .sidebar{display:none;position:fixed;left:0;top:0;bottom:0;height:100%;z-index:90;width:min(270px,80vw);padding-top:calc(18px + env(safe-area-inset-top));overflow-y:auto;box-shadow:0 0 50px #000a}
  .sidebar.open{display:block}
  .side-back{position:fixed;inset:0;background:#0008;z-index:85;display:none}.side-back.show{display:block}
  .main{padding:20px 12px 84px;min-width:0}
  input,select,textarea{font-size:16px!important}
  .matrix input{width:88px}
  .appbar{width:100%;max-width:100%;overflow:hidden;height:calc(62px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 9px 0;min-height:62px}
  .menuBtn{flex:none}.brand{font-size:17px;margin-left:3px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .app-actions{gap:4px;min-width:0;flex:1;justify-content:flex-end;overflow:hidden}
  .app-actions .hide-mobile{display:flex;flex:none}
  .mobile-settings{position:fixed;left:8px;right:8px;width:auto;max-width:calc(100% - 16px);bottom:calc(75px + env(safe-area-inset-bottom));z-index:70;display:none;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:10px;box-shadow:0 15px 40px #0007}
  .mobile-settings.open{display:block}.mobile-settings-title{font-size:12px;font-weight:700;color:var(--muted);padding:4px 8px 7px}
  .mobile-settings .nav-btn{margin:2px 0}.mobile-settings .danger-nav{color:#ff8d97}
  .year-dialog{max-width:calc(100vw - 32px)}
  .app-actions button{min-width:38px;width:38px;padding:0}
  .year-select{height:38px;min-width:88px;width:88px;padding:0 5px}
  .year-add{width:auto!important;min-width:72px!important;height:38px!important;padding:0 7px!important;font-size:11px!important}
  .user-chip{display:none!important}
  .layout{min-height:calc(100vh - 62px - env(safe-area-inset-top))}.grid{grid-template-columns:1fr}.stat{grid-template-columns:repeat(3,1fr)}
  .form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .mobile-bottom{position:fixed;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));bottom:0;left:0;right:0;width:100%;max-width:100%;height:calc(67px + env(safe-area-inset-bottom));
    background:rgba(16,18,22,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
  body.light .mobile-bottom{background:rgba(255,255,255,.97)}
  .mobile-bottom button{background:transparent;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .mobile-bottom button.active{color:var(--accent);font-weight:700}.mobile-bottom .mi{height:21px;display:grid;place-items:center}
  .hero{display:block}.hero-actions{margin-top:14px}
}
/* 部費回収表：スマホでは4列を1画面内に収める */
.fee-table{min-width:0!important;width:100%;table-layout:fixed;border-collapse:collapse;box-sizing:border-box}
.fee-table th,.fee-table td{padding:10px 8px;box-sizing:border-box;overflow:hidden}
.fee-table .fee-check-col{width:48px}.fee-table .fee-member-col{width:auto}.fee-table .fee-status-col{width:92px}.fee-table .fee-amount-col{width:86px}
.fee-table td{height:52px}
.fee-table .fee-name-cell{min-width:0}
.fee-table .fee-name{display:block;overflow-wrap:anywhere;word-break:break-word;line-height:1.35}
.fee-table tr.paid td{background:rgba(84,209,122,.05)}
.fee-filter{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.fee-filter input{width:18px;height:18px;accent-color:var(--accent)}
@media(max-width:560px){
  .fee-table th,.fee-table td{padding:8px 5px;font-size:11px}
  .fee-table th{font-size:9px;letter-spacing:0}
  .fee-table .fee-check-col{width:38px}.fee-table .fee-status-col{width:76px}.fee-table .fee-amount-col{width:70px}
  .fee-table .check{width:27px;height:27px;border-radius:7px;font-size:14px}
  .fee-table .badge{font-size:9px;padding:3px 5px;white-space:nowrap}
}

@media(max-width:560px){
  .stat{grid-template-columns:1fr 1fr}.statbox:last-child{grid-column:1/-1}
  .balance-num{font-size:34px}.card.pad{padding:14px}.section{margin-top:19px}
  .section-head{align-items:flex-start}.section-head .btn{white-space:nowrap}
  .event-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .event-toolbar .event-select{grid-column:1/-1}
  .event-toolbar .btn{white-space:nowrap;font-size:13px;padding:10px 6px}
  .event-select{width:100%;min-width:0}
  .event-actions{display:grid!important;grid-template-columns:1fr 1.6fr}
  .event-actions .btn{font-size:13px;padding:11px 6px}
}

/* iPhone compact top bar: keep every header control on one row */
@media (max-width: 600px){
  .appbar{
    height:calc(56px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) 4px 0;
    min-height:56px;
    overflow:hidden;
    gap:0;
  }
  .menuBtn{width:29px;height:29px;min-width:29px;padding:0;font-size:18px;border-radius:7px}
  .menuBtn svg{width:18px;height:18px}
  .brand{
    font-size:13px;
    letter-spacing:0;
    margin-left:2px;
    white-space:nowrap;
    flex:0 1 82px;
    min-width:70px;
    overflow:hidden;
    text-overflow:clip;
  }
  .brand::before{width:4px;height:17px;margin-right:5px;vertical-align:-4px}
  .app-actions{
    margin-left:2px;
    gap:2px;
    flex:1 1 auto;
    min-width:0;
    overflow:visible;
    justify-content:flex-end;
  }
  .app-actions button{
    height:30px;
    min-width:26px;
    width:26px;
    padding:0;
    border-radius:7px;
    flex:0 0 26px;
  }
  .app-actions button svg{width:16px;height:16px}
  .year-select{
    height:30px!important;
    min-width:58px!important;
    width:58px!important;
    padding:0 2px!important;
    font-size:10px!important;
    flex:0 0 58px;
  }
  .year-add{
    width:48px!important;
    min-width:48px!important;
    height:30px!important;
    padding:0 2px!important;
    font-size:9px!important;
    line-height:1.1!important;
    flex:0 0 48px;
  }
  .layout{min-height:calc(100vh - 56px - env(safe-area-inset-top))}
}

@media (max-width: 360px){
  .menuBtn{width:26px;min-width:26px}
  .brand{font-size:12px;min-width:62px;flex-basis:70px}
  .app-actions{gap:1px;margin-left:1px}
  .year-select{min-width:52px!important;width:52px!important;flex-basis:52px}
  .year-add{min-width:44px!important;width:44px!important;flex-basis:44px}
  .app-actions button{width:24px;min-width:24px;flex-basis:24px}
  .app-actions button svg{width:15px;height:15px}
}

/* ===== ログイン画面・閲覧／編集モード ===== */
body.locked .appbar,body.locked .layout,body.locked .mobile-bottom,body.locked .mobile-settings,body.locked .side-back{display:none!important}
.login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow-y:auto}
.login-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:28px 22px;box-shadow:var(--shadow);display:grid;gap:14px}
.login-card .brand{margin:0 0 2px;font-size:20px}
.login-card p{margin:0;font-size:13px}
.login-card .field input{font-size:16px;padding:12px}
.login-keep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.login-keep input{width:18px;height:18px;accent-color:var(--accent)}
.login-error{color:var(--danger);font-size:13px;min-height:1em}
.login-card .btn{padding:13px;font-size:15px}
.status-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:12px}
.status-bar.edit{border-color:#6c1e28;background:linear-gradient(135deg,#170c0f,var(--surface))}
body.light .status-bar.edit{background:#fff4f5;border-color:#f0c8cd}
.status-bar .st-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-bar .st-mode{font-weight:750}
.status-bar .st-actions{display:flex;gap:6px}
.badge.red{background:#3a1218;color:#ff8d97}
body.readonly .edit-only,body.readonly .btn.danger,body.readonly .member-admin,body.readonly .member-delete{display:none!important}
body.readonly .check,body.readonly #accountantBtn{pointer-events:none}
body:not(.readonly) .view-only{display:none!important}
.mobile-settings{max-height:calc(100vh - 160px);overflow-y:auto}
</style>
</head>
<body class="locked">
<div id="loginScreen" class="login-screen">
  <form class="login-card" onsubmit="return doLogin(event)" autocomplete="on">
    <div class="brand">部活会計管理</div>
    <p class="muted">ユーザー名とパスワードを入力してください。</p>

<script>
const KEY='clubAccounting_v1';
const DEFAULT_YEAR=String(new Date().getFullYear());
// 公開版では部員名をソースに書かず、暗号化データ（data.enc.json）側に持たせる
const INITIAL_MEMBERS=[];
function createYearData(members){
  return {
    members:Array.isArray(members)?[...members]:[],
    accountant:'',
    transactions:[],
    fees:{前期:{amount:10000,paid:[]},後期:{amount:10000,paid:[]}},
    events:[]
  };
}

// 部員名簿は年度ごとの会計データとは分離し、年度をまたいで共有する。
function normalizeMemberDirectory(state){
  if(!Array.isArray(state.memberDirectory)) state.memberDirectory=[];
  const seen=new Set();
  const cleaned=[];
  const add=name=>{
    const n=String(name??'').trim();
    if(n&&!seen.has(n)){seen.add(n);cleaned.push(n)}
  };
  state.memberDirectory.forEach(add);
  Object.values(state.years||{}).forEach(y=>{if(y&&Array.isArray(y.members))y.members.forEach(add)});
  state.memberDirectory=cleaned;
  // JSONからの初期部員投入は一度だけ。毎回追加すると、削除した部員が復活してしまうため。
  if(!state.initialMembersImported){
    INITIAL_MEMBERS.forEach(add);
    state.initialMembersImported=true;
  }
  return state.memberDirectory;
}
function writeStore(){
  if(!editMode)return true; // 閲覧モードでは端末に保存しない
  try{localStorage.setItem(KEY,JSON.stringify(appState));return true}
  catch(e){console.error(e);showToast('保存に失敗しました。ストレージの空き容量やプライベートモードを確認してください。','error');return false}
}
let appState=null,currentYear=DEFAULT_YEAR,data=null;
// 読み込んだデータ（公開データまたは端末内データ）を正規化して画面用の状態にする
function setupState(base){
  let st=base;
  if(!(st&&st.years&&typeof st.years==='object')){
    const legacy=st&&st.members&&st.transactions&&st.fees?st:createYearData();
    st={currentYear:DEFAULT_YEAR,years:{[DEFAULT_YEAR]:legacy}};
  }
  Object.keys(st.years).forEach(k=>{if(!st.years[k]||typeof st.years[k]!=='object')delete st.years[k]});
  appState=st;
  currentYear=String(appState.currentYear||Object.keys(appState.years)[0]||DEFAULT_YEAR);
  if(!appState.years[currentYear])appState.years[currentYear]=createYearData();
  normalizeMemberDirectory(appState);
  if(!appState.years['2026'])appState.years['2026']=createYearData(appState.memberDirectory);
  appState.years['2026'].members=[...appState.memberDirectory];
  data=appState.years[currentYear];
  data.members=[...appState.memberDirectory];
  normalizeData();
  appState.years[currentYear]=data;
}
function normalizeData(){
  if(typeof data.accountant!=='string')data.accountant='';

  data.members=Array.isArray(data.members)?data.members:[];
  data.transactions=Array.isArray(data.transactions)?data.transactions:[];
  data.fees=data.fees||{};
  for(const term of ['前期','後期']){
    data.fees[term]=data.fees[term]||{amount:10000,paid:[]};
    data.fees[term].amount=Number(data.fees[term].amount)||0;
    data.fees[term].paid=Array.isArray(data.fees[term].paid)?data.fees[term].paid:[];
  }
  data.events=Array.isArray(data.events)?data.events:[];
  data.events.forEach(e=>{
    e.columns=Array.isArray(e.columns)?e.columns:['ガソリン代','高速代','宿泊費','その他'];
    e.rows=Array.isArray(e.rows)?e.rows:[];
    e.rows.forEach(r=>{r.values=r.values&&typeof r.values==='object'?r.values:{};r.reimbursed=!!r.reimbursed});
  });
}
let feeTerm='前期', historyFilter='all', currentEventId=null;

function showToast(message, type='success'){let el=document.getElementById('appToast');if(!el){el=document.createElement('div');el.id='appToast';el.style.cssText='position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);z-index:99999;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:12px;background:#171717;color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center';document.body.appendChild(el)}el.textContent=message;el.style.background=type==='error'?'#b42318':type==='info'?'#344054':'#171717';el.style.opacity='1';el.style.transform='translateX(-50%) translateY(0)';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-50%) translateY(12px)'},2200)}
function save(){
  if(!editMode){
    // 閲覧モードで万一データが変更されても、公開データに戻す
    if(viewSnapshot){const y=currentYear;setupState(JSON.parse(viewSnapshot));if(appState.years[y]){currentYear=y;data=appState.years[y];data.members=[...appState.memberDirectory];normalizeData()}}
    renderYearSelector();renderAccountant();renderAll();
    showToast('閲覧モードでは編集できません。','info');
    return;
  }
  appState.updatedAt=Date.now();
  appState.currentYear=currentYear;
  appState.years[currentYear]=data;
  writeStore();
  renderYearSelector();
  renderAccountant();
  renderAll();
  updateStatusBar();
}
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

  data=appState.years[currentYear];

  currentEventId=null;

function showPage(p){

function byDateDesc(a,b){return String(b.date||'').localeCompare(String(a.date||''))||(Number(b.created)||0)-(Number(a.created)||0)}

function renderHome(){
  const transactionIncome=data.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
  const transactionExpense=data.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
  const collectedFees=Object.values(data.fees||{}).reduce((sum,f)=>{
    return sum+(f?.paid||[]).length*Number(f?.amount||0);
  },0);
  const income=transactionIncome+collectedFees;
  const expense=transactionExpense;
  const balance=income-expense;
  document.getElementById('balanceNum').textContent=yen(balance);
  document.getElementById('balanceSub').textContent=`部費回収 ${yen(collectedFees)}  その他収入 ${yen(transactionIncome)} ／ 支出 ${yen(expense)}`;
  const fee=data.fees[feeTerm], collected=(fee?.paid||[]).length*Number(fee?.amount||0);
  document.getElementById('feeCollected').textContent=yen(collected);
  document.getElementById('expenseCount').textContent=data.transactions.filter(t=>t.type==='expense').length+'件';
  const unpaid=data.events.flatMap(e=>e.rows||[]).reduce((sum,r)=>sum+(r.reimbursed?0:Object.values(r.values||{}).reduce((a,v)=>a+Number(v||0),0)),0);
  document.getElementById('unpaidAdvance').textContent=yen(unpaid);
  const list=[...data.transactions].sort(byDateDesc).slice(0,8);
  document.getElementById('recentTable').innerHTML=transactionTable(list,true);
}
function transactionTable(list,compact=false){
  if(!list.length)return '<div class="empty">まだ履歴がありません。<br>「履歴を追加」から登録できます。</div>';
  return `<table><thead><tr><th>日付</th><th>区分</th><th>項目</th><th>名前</th><th class="amount">金額</th>${compact?'':'<th>メモ</th><th></th>'}</tr></thead><tbody>`+
  list.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="badge ${t.type==='income'?'green':''}">${t.type==='income'?'収入':'支出'}</span></td><td>${esc(t.category)}</td><td>${esc(t.name||'部活会計')}</td><td class="amount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${yen(t.amount)}</td>${compact?'':`<td>${esc(t.note||'')}</td><td><button class="btn small danger" onclick="deleteTransaction('${t.id}')">削除</button></td>`}</tr>`).join('')+'</tbody></table>';
}

function addTransaction(type){
  const amount=Number(document.getElementById('txAmount').value);
  const category=document.getElementById('txCategory').value.trim();
  if(!category){alert('項目を入力してください。');return}
  if(!Number.isFinite(amount)||amount<=0){alert('金額は1円以上の数値で入力してください。');return}
  if(!document.getElementById('txDate').value){alert('日付を入力してください。');return}
  data.transactions.push({id:uid(),created:Date.now(),type,date:document.getElementById('txDate').value,amount,category,name:document.getElementById('txName').value,note:document.getElementById('txNote').value.trim()});
  closeModal();save();
}
function deleteTransaction(id){const t=data.transactions.find(x=>x.id===id);if(!t)return;if(!confirm(`${t.date} ${t.category} ${yen(t.amount)} を削除しますか？`))return;data.transactions=data.transactions.filter(t=>t.id!==id);save();showToast('履歴を削除しました。')}

function addMember(){
  const el=document.getElementById('newMember'),name=el.value.trim();if(!name)return;
  normalizeMemberDirectory(appState);
  if(appState.memberDirectory.includes(name)){alert('同じ名前がすでに登録されています。');return}
  appState.memberDirectory.push(name);
  Object.values(appState.years).forEach(y=>{y.members=[...appState.memberDirectory]});
  data=appState.years[currentYear];el.value='';save();
}
function removeMemberByName(name){
  name=String(name??'').trim();
  if(!name)return;
  if(!appState.memberDirectory.includes(name))return;
  if(!confirm(`「${name}」を部員名簿から削除しますか？\n全年度の部費回収記録からも外れます。`))return;
  appState.memberDirectory=appState.memberDirectory.filter(x=>x!==name);
  Object.values(appState.years||{}).forEach(y=>{
    if(!y)return;
    y.members=Array.isArray(y.members)?y.members.filter(x=>x!==name):[];
    if(y.fees){
      if(y.fees.前期)y.fees.前期.paid=(y.fees.前期.paid||[]).filter(x=>x!==name);
      if(y.fees.後期)y.fees.後期.paid=(y.fees.後期.paid||[]).filter(x=>x!==name);
    }
  });
  data=appState.years[currentYear];
  save();
  renderMembers();
  showToast(`「${name}」を部員名簿から削除しました。`);
}
function removeMember(i){

  removeMemberByName(data.members[i]);
}

function eventTable(e){
  return `<table class="matrix"><thead><tr><th>立替者</th>${e.columns.map((c,j)=>`<th>${esc(c)}<br><button class="btn small danger" onclick="removeEventColumn(${j})">削除</button></th>`).join('')}<th>合計</th><th>精算</th></tr></thead><tbody>${e.rows.map((r,i)=>{const total=e.columns.reduce((s,c)=>s+Number(r.values[c]||0),0);return `<tr><td class="member-name">${esc(r.member)}<br><button class="btn small danger" onclick="removeEventMember(${i})">立替者を削除</button></td>${e.columns.map((c,j)=>`<td><input type="number" min="0" inputmode="numeric" ${editMode?'':'readonly'} value="${r.values[c]||''}" placeholder="0" data-row="${i}" data-col="${j}" onchange="setCell(${i},${j},this.value)"></td>`).join('')}<td class="amount total" id="evRowTotal${i}">${yen(total)}</td><td><button class="check ${r.reimbursed?'on':''}" onclick="toggleReimbursed(${i})">${r.reimbursed?'✓':''}</button></td></tr>`}).join('')}</tbody><tfoot><tr><th>項目合計</th>${e.columns.map((c,j)=>`<th class="amount" id="evColTotal${j}">${yen(e.rows.reduce((s,r)=>s+Number(r.values[c]||0),0))}</th>`).join('')}<th class="amount" id="evGrandTotal">${yen(e.rows.reduce((s,r)=>s+e.columns.reduce((a,c)=>a+Number(r.values[c]||0),0),0))}</th><th></th></tr></tfoot></table>`;
}
function setCell(i,j,v){
  const e=selectedEvent();if(!e||!e.rows[i]||e.columns[j]===undefined)return;
  const c=e.columns[j];
  const n=Math.max(0,Math.round(Number(v)||0));
  e.rows[i].values[c]=n;
  // 全体を再描画すると次の入力欄へのフォーカスが外れるため、合計欄だけ更新する
  if(!editMode)return save();
  appState.updatedAt=Date.now();appState.years[currentYear]=data;writeStore();updateStatusBar();
  const rowTotal=e.columns.reduce((s,k)=>s+Number(e.rows[i].values[k]||0),0);
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=yen(val)};
  set('evRowTotal'+i,rowTotal);

async function shareOrDownloadFile(text, filename, title='ファイルを保存'){
  // スマホ（iPhone/iPad/Android）は共有シートを優先する。
  // iPhoneでは共有シートの「"ファイル"に保存」で任意の場所に保存できる。
  if(isTouchDevice() && navigator.share && navigator.canShare){
    // 環境によってはJSON形式の共有を拒否するため、テキスト形式でも試す
    const candidates=[
      new File([text],filename,{type:'application/json'}),
      new File([text],filename,{type:'text/plain'})
    ];
    for(const file of candidates){
      let ok=false;
      try{ok=navigator.canShare({files:[file]})}catch(_){ok=false}
      if(!ok)continue;
      try{
        await navigator.share({title,files:[file]});
        showToast('バックアップを書き出しました。');
        return true;
      }catch(e){
        // ユーザーが共有シートを閉じた場合は何もしない
        if(e&&e.name==='AbortError')return false;
        break; // それ以外の失敗は下の代替手段へ
      }
    }
  }

  // iOSで共有シートが使えない環境（アプリ内ビューア等）ではダウンロードが動かないため、
  // 保存・コピー用の画面を出す
  if(isIOS()){openExportFallback(text,filename);return false}

  // PCブラウザ等：通常のダウンロード
  try{
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('バックアップをダウンロードしました。');
    return true;
  }catch(e){
    openExportFallback(text,filename);return false;
  }
}

// ===== ログイン・暗号化・公開 =====
// data.enc.json はユーザー名＋パスワードから作った鍵（PBKDF2）で AES-GCM 暗号化されている。
// ユーザー名・パスワードはどこにも保存されず、正しい組み合わせでないと中身を復号できない。
const DATA_URL='data.enc.json';
const SESSION_KEY='clubSession_v1', EDIT_KEY='clubEditMode', PUBLISHED_KEY='clubPublishedAt', GH_KEY='clubGithub_v1';
const GH_DEFAULT={owner:'seigo171211-cloud',repo:'club-kaikei',branch:'main',path:'data.enc.json'};
const PBKDF2_ITER=310000;
let sessionKey=null, sessionSalt=null, sessionIter=PBKDF2_ITER;
let editMode=false, viewSnapshot=null, remoteUpdatedAt=0;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}

async function deriveKey(user,pass,salt,iter){
  const material=await crypto.subtle.importKey('raw',te.encode(String(user).trim().normalize('NFC')+'\n'+String(pass).normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function encryptState(state,key=sessionKey,salt=sessionSalt,iter=sessionIter){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(state))));
  return {v:1,kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function decryptPayload(p,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p.iv)},key,unb64(p.ct));
  return JSON.parse(td.decode(pt));
}
async function fetchPayload(){
  let r;
  try{r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'})}
  catch(e){throw Object.assign(new Error('network'),{code:'network'})}
  if(!r.ok)throw Object.assign(new Error('http '+r.status),{code:'network'});
  const p=await r.json();
  if(!p||p.v!==1||!p.salt||!p.iv||!p.ct)throw Object.assign(new Error('format'),{code:'format'});
  return p;
}

function showLogin(msg=''){
  document.body.classList.add('locked');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginError').textContent=msg;
  closeModal();
}
function setLoginBusy(b){
  const btn=document.getElementById('loginBtn');
  btn.disabled=b;btn.textContent=b?'確認中…':'ログイン';
}
async function doLogin(ev){
  if(ev)ev.preventDefault();
  const u=document.getElementById('loginUser').value;
  const pw=document.getElementById('loginPass').value;
  const keep=document.getElementById('loginKeep').checked;
  const err=document.getElementById('loginError');
  err.textContent='';
  if(!u.trim()||!pw){err.textContent='ユーザー名とパスワードを入力してください。';return false}
  if(!window.crypto||!crypto.subtle){err.textContent='この環境では暗号化機能が使えません。https のURLで開いてください。';return false}
  setLoginBusy(true);
  try{
    const p=await fetchPayload();
    const salt=unb64(p.salt), iter=Number(p.iter)||PBKDF2_ITER;
    const key=await deriveKey(u,pw,salt,iter);
    let remote;
    try{remote=await decryptPayload(p,key)}
    catch(_){err.textContent='ユーザー名またはパスワードが違います。';return false}
    sessionKey=key;sessionSalt=salt;sessionIter=iter;
    await persistSession(keep);
    document.getElementById('loginPass').value='';
    enterApp(remote);
  }catch(e){
    err.textContent=e.code==='format'?'公開データの形式が正しくありません。':'データを取得できませんでした。通信状況を確認してください。';
  }finally{setLoginBusy(false)}
  return false;
}
async function persistSession(keep){
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',sessionKey));
  const v=JSON.stringify({k:b64(raw),salt:b64(sessionSalt),iter:sessionIter});
  try{
    sessionStorage.setItem(SESSION_KEY,v);
    if(keep===true)localStorage.setItem(SESSION_KEY,v);
    else if(keep===false)localStorage.removeItem(SESSION_KEY);
    else if(localStorage.getItem(SESSION_KEY))localStorage.setItem(SESSION_KEY,v); // 保持中なら更新
  }catch(_){}
}
function clearSession(){
  try{sessionStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_KEY)}catch(_){}
  sessionKey=null;sessionSalt=null;
}
async function tryAutoLogin(){
  let saved=null;
  try{saved=sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY)}catch(_){}
  if(!saved||!window.crypto||!crypto.subtle){showLogin();return}
  let s,key;
  try{
    s=JSON.parse(saved);
    key=await crypto.subtle.importKey('raw',unb64(s.k),{name:'AES-GCM'},true,['encrypt','decrypt']);
  }catch(_){clearSession();showLogin();return}
  let p;
  try{p=await fetchPayload()}
  catch(e){showLogin('データを取得できませんでした。通信状況を確認してから再度ログインしてください。');return}
  try{
    const remote=await decryptPayload(p,key);
    sessionKey=key;sessionSalt=unb64(p.salt);sessionIter=Number(p.iter)||PBKDF2_ITER;
    enterApp(remote);
  }catch(_){
    // パスワードが変更された等で復号できない
    clearSession();
    showLogin('ログイン情報が変更された可能性があります。もう一度ログインしてください。');
  }
}

function enterApp(remote){
  remoteUpdatedAt=Number(remote&&remote.updatedAt)||0;
  if(editMode){
    let local=null;
    try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}

    const localAt=localOk?Number(local.updatedAt)||0:0;
    const publishedAt=Number(localStorage.getItem(PUBLISHED_KEY))||0;
    let base=remote;
    if(localOk&&localAt>remoteUpdatedAt){
      base=local; // 端末内に公開前の新しい変更がある
    }else if(localOk&&localAt>publishedAt&&localAt!==remoteUpdatedAt){
      if(!confirm('公開データの方が新しいため、公開データを読み込みます。\nこの端末の未公開の変更は破棄されます。よろしいですか？\n（キャンセルするとこの端末のデータを使います）'))base=local;
    }
    if(base===remote)localStorage.setItem(PUBLISHED_KEY,String(remoteUpdatedAt));
    setupState(JSON.parse(JSON.stringify(base)));
    writeStore();
  }else{
    viewSnapshot=JSON.stringify(remote);
    setupState(JSON.parse(viewSnapshot));
  }
  document.body.classList.remove('locked');
  document.body.classList.toggle('readonly',!editMode);
  document.getElementById('loginScreen').classList.add('hidden');
  feeTerm='前期';historyFilter='all';currentEventId=null;
  document.querySelectorAll('.mode-label').forEach(el=>el.textContent=editMode?'閲覧モードに戻る':'会計担当モード');
  renderYearSelector();renderAccountant();renderAll();updateStatusBar();
}
async function reloadRemote(){
  if(!sessionKey){showLogin();return}
  let p;
  try{p=await fetchPayload()}catch(_){showToast('最新データを取得できませんでした。','error');return}
  try{
    const remote=await decryptPayload(p,sessionKey);
    sessionSalt=unb64(p.salt);sessionIter=Number(p.iter)||PBKDF2_ITER;
    enterApp(remote);
    showToast('最新のデータを読み込みました。');
  }catch(_){clearSession();showLogin('ログイン情報が変更されました。もう一度ログインしてください。')}
}

}

  }else{
    el.innerHTML=`<div class="st-left"><span class="st-mode">閲覧モード</span><span class="muted">最終更新 ${fmtTime(remoteUpdatedAt)}</span></div><div class="st-actions"><button class="btn small outline" onclick="reloadRemote()">最新に更新</button></div>`;
  }
}
function toggleEditMode(){
  if(!editMode){
    if(!confirm('会計担当モードに切り替えますか？\n\nこの端末でデータを編集できるようになります。\n編集内容は「公開データを更新」を押すまで他の人には表示されません。\n※会計担当以外は使わないでください。'))return;
    editMode=true;
    try{localStorage.setItem(EDIT_KEY,'1')}catch(_){}
    enterApp(JSON.parse(viewSnapshot||JSON.stringify(appState)));
    showToast('会計担当モードにしました。');
  }else{
    if(hasUnpublished()&&!confirm('未公開の変更があります。\n閲覧モードでは公開データが表示されます（変更はこの端末に残り、会計担当モードに戻すと復元されます）。\n切り替えますか？'))return;
    editMode=false;
    try{localStorage.setItem(EDIT_KEY,'0')}catch(_){}
    reloadRemote();
  }
}

// ---- 公開（GitHubへ反映） ----
function getGh(){
  let g={};
  try{g=JSON.parse(localStorage.getItem(GH_KEY)||'{}')||{}}catch(_){}
  return {...GH_DEFAULT,...g};
}
async function publishData(){
  if(!requireEdit())return;
  if(!sessionKey){showLogin('もう一度ログインしてください。');return}
  appState.currentYear=currentYear;
  appState.years[currentYear]=data;
  if(!appState.updatedAt)appState.updatedAt=Date.now();
  const stamp=appState.updatedAt;
  const text=JSON.stringify(await encryptState(appState));
  const gh=getGh();
  if(gh.token){
    if(!confirm(`暗号化したデータを公開します。\n（${gh.owner}/${gh.repo} の ${gh.path} を更新）\nよろしいですか？`))return;
    showToast('公開しています…','info');
    try{
      await pushToGithub(gh,text);
      localStorage.setItem(PUBLISHED_KEY,String(stamp));
      remoteUpdatedAt=stamp;
      updateStatusBar();
      alert('公開しました。\n他の人の画面に反映されるまで1〜2分かかることがあります。');
    }catch(e){
      alert('公開に失敗しました。\n'+e.message+'\n\n「GitHub連携設定」のトークンや期限を確認してください。');
    }
  }else{
    await shareOrDownloadFile(text,'data.enc.json','公開用データ');
    alert('公開用ファイル「data.enc.json」を作成しました。\n\nGitHubのリポジトリで「Add file → Upload files」からこのファイルをアップロード（上書き）すると公開されます。\n\n「GitHub連携設定」でトークンを登録すると、このボタン1つで公開できるようになります。');
  }
}
async function pushToGithub(gh,text){
  const path=String(gh.path||'data.enc.json').split('/').map(encodeURIComponent).join('/');
  const api=`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${path}`;
  const headers={Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  let sha;
  const g=await fetch(api+'?ref='+encodeURIComponent(gh.branch)+'&t='+Date.now(),{headers,cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;
  else if(g.status!==404)throw new Error(`現在のファイルを取得できませんでした（${g.status}）`);
  const r=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},
    body:JSON.stringify({message:'会計データを更新 '+fmtTime(Date.now()),content:btoa(text),branch:gh.branch,...(sha?{sha}:{})})});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(_){}throw new Error(`GitHubエラー（${r.status}）${m}`)}
}
function openGithubSettings(){
  if(!requireEdit())return;
  const g=getGh();
  document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>GitHub連携設定</h3><button class="close" onclick="closeModal()" aria-label="閉じる">×</button></div>
  <div class="modal-body">
    <p class="note" style="margin-top:0">トークンを登録すると「公開データを更新」ボタン1つで全員の画面に反映できます。トークンはこの端末のブラウザ内にだけ保存されます。</p>
    <div class="form-grid">
      <div class="field"><label>ユーザー名（owner）</label><input id="ghOwner" value="${esc(g.owner)}" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label>リポジトリ名</label><input id="ghRepo" value="${esc(g.repo)}" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label>ブランチ</label><input id="ghBranch" value="${esc(g.branch)}" autocapitalize="off" autocorrect="off"></div>
      <div class="field"><label>ファイル</label><input id="ghPath" value="${esc(g.path)}" autocapitalize="off" autocorrect="off"></div>
      <div class="field full"><label>アクセストークン ${g.token?'（登録済み・変更する場合のみ入力）':''}</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_..."></div>
    </div>
    <div class="modal-tip">トークンの作り方：<br>
      ① <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent3)">GitHubのトークン作成ページ</a>を開く<br>
      ② Repository access →「Only select repositories」でこのリポジトリだけを選ぶ<br>
      ③ Permissions → Repository permissions →「Contents」を「Read and write」にする<br>
      ④ 作成されたトークンをコピーして上に貼り付ける</div>
  </div>
  <div class="modal-foot">${g.token?'<button class="btn danger" onclick="clearGhToken()">トークンを削除</button>':''}<button class="btn outline" onclick="closeModal()">キャンセル</button><button class="btn green" onclick="saveGithubSettings()">保存</button></div>`;
  openModal();
}
function saveGithubSettings(){
  const cur=getGh();
  const v=id=>document.getElementById(id).value.trim();
  const g={owner:v('ghOwner'),repo:v('ghRepo'),branch:v('ghBranch')||'main',path:v('ghPath')||'data.enc.json',token:v('ghToken')||cur.token||''};
  if(!g.owner||!g.repo){alert('ユーザー名とリポジトリ名を入力してください。');return}
  try{localStorage.setItem(GH_KEY,JSON.stringify(g))}catch(_){alert('保存できませんでした。');return}
  closeModal();showToast('GitHub連携設定を保存しました。');
}
function clearGhToken(){
  if(!confirm('この端末に保存したトークンを削除しますか？'))return;
  const g=getGh();delete g.token;
  try{localStorage.setItem(GH_KEY,JSON.stringify(g))}catch(_){}
  closeModal();showToast('トークンを削除しました。');
}

// ---- ログイン情報の変更 ----
function openChangeCredentials(){
  if(!requireEdit())return;
  document.getElementById('modalContent').innerHTML=`<div class="modal-head"><h3>ログイン情報を変更</h3><button class="close" onclick="closeModal()" aria-label="閉じる">×</button></div>
  <div class="modal-body"><div class="form-grid">
    <div class="field full"><label>新しいユーザー名</label><input id="ncUser" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>新しいパスワード（8文字以上）</label><input id="ncPass" type="password" autocomplete="new-password"></div>
    <div class="field"><label>新しいパスワード（確認）</label><input id="ncPass2" type="password" autocomplete="new-password"></div>
  </div>
  <div class="modal-tip">変更後に「公開データを更新」した時点で、全員が新しいユーザー名・パスワードでログインする必要があります。新しい情報は必ず控えてください（忘れると誰もデータを開けなくなります）。</div></div>
  <div class="modal-foot"><button class="btn outline" onclick="closeModal()">キャンセル</button><button class="btn green" onclick="saveCredentials()">変更する</button></div>`;
  openModal();
}
async function saveCredentials(){
  const u=document.getElementById('ncUser').value, p1=document.getElementById('ncPass').value, p2=document.getElementById('ncPass2').value;
  if(!u.trim()){alert('ユーザー名を入力してください。');return}
  if(p1.length<8){alert('パスワードは8文字以上にしてください。');return}
  if(p1!==p2){alert('確認用のパスワードが一致しません。');return}
  if(!confirm('ログイン情報を変更して、すぐに公開しますか？'))return;
  sessionSalt=crypto.getRandomValues(new Uint8Array(16));
  sessionIter=PBKDF2_ITER;
  sessionKey=await deriveKey(u,p1,sessionSalt,sessionIter);
  await persistSession();
  appState.updatedAt=Date.now();writeStore();
  closeModal();updateStatusBar();
  await publishData();
}

// ---- 起動 ----
function initApp(){
  applyTheme();
  try{editMode=localStorage.getItem(EDIT_KEY)==='1'}catch(_){editMode=false}
  tryAutoLogin();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initApp,{once:true});
else initApp();

</script>
