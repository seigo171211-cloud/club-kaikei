<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おつかれドロップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade. Header strip (title / score / next), lacquer box in the middle, evolution chain below.
   Single deliberate look: late-night walk home from a shift, a red lacquered jubako under a streetlamp. */
:root {
  --night: #1b1a2e;
  --night-2: #26243f;
  --ink: #f4ead8;
  --muted: #a9a2c2;
  --lamp: #ffcf6e;
  --lacquer: #8e2a2a;
  --lacquer-dark: #5b1717;
  --paper: #f6ecd9;
  --danger: #ff6b6b;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% -10%, var(--night-2), var(--night) 60%);
  background-color: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column; align-items: center;
  gap: 10px;
  padding-inline: 16px; padding-block: 10px;
}
header {
  width: 100%; max-width: 460px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: 1.35rem; line-height: 1.1; margin: 0; letter-spacing: .02em;
  color: var(--lamp);
}
h1 small { display: block; font-family: var(--font-body); font-size: .7rem; color: var(--muted); letter-spacing: .08em; font-weight: 500; }
.stats { display: flex; gap: 14px; align-items: center; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat .label { font-size: .65rem; color: var(--muted); letter-spacing: .12em; }
.stat .value { font-family: var(--font-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
#nextCanvas { width: 44px; height: 44px; }
.stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
#game { display: block; border-radius: 6px; cursor: none; }
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
}
.card {
  background: color-mix(in srgb, var(--night) 88%, transparent);
  border: 1px solid color-mix(in srgb, var(--lamp) 40%, transparent);
  border-radius: 14px; padding: 22px 26px; text-align: center; max-width: 300px;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.card h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 1.6rem; color: var(--lamp); }
.card p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .9rem; }
.card .big { font-family: var(--font-display); font-size: 2.2rem; color: var(--ink); font-variant-numeric: tabular-nums; }
button {
  font-family: var(--font-body); font-weight: 700; font-size: .95rem;
  background: var(--lamp); color: var(--night); border: 0; border-radius: 999px;
  padding: 10px 22px; cursor: pointer;
}
button.ghost { background: transparent; color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 50%, transparent); padding: 6px 14px; font-size: .8rem; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
footer {
  width: 100%; max-width: 460px;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
#chain { width: 100%; max-width: 460px; height: 34px; }
.hint { font-size: .72rem; color: var(--muted); text-align: center; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
kbd { font-family: var(--font-body); border: 1px solid color-mix(in srgb, var(--muted) 50%, transparent); border-radius: 4px; padding: 0 5px; font-size: .7rem; }
@media (max-width: 420px) { h1 { font-size: 1.1rem; } .stat .value { font-size: 1.05rem; } .stats { gap: 10px; } }
</style>

<div class="app">
  <header>
    <h1>おつかれドロップ<small>同じおやつをくっつけて、ケーキを目指そう</small></h1>
    <div class="stats">
      <div class="stat"><span class="label">スコア</span><span class="value" id="score">0</span></div>
      <div class="stat"><span class="label">ベスト</span><span class="value" id="best">0</span></div>
      <div class="stat"><span class="label">つぎ</span><canvas id="nextCanvas" width="88" height="88"></canvas></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="startOverlay">
      <div class="card">
        <h2>バイトおつかれ</h2>
        <p>上からおやつを落として、同じものどうしをくっつけると一段階おおきくなります。<br>おやつの形はいろいろ。回してすき間にはめよう。<br>赤い線より上にあふれたら終わり。</p>
        <button id="startBtn">はじめる</button>
      </div>
    </div>
    <div class="overlay" id="overOverlay" hidden>
      <div class="card">
        <h2>おなかいっぱい</h2>
        <div class="big" id="finalScore">0</div>
        <p id="overMsg">今日もよくがんばりました。</p>
        <button id="retryBtn">もう一回</button>
      </div>
    </div>
  </div>

  <footer>
    <canvas id="chain"></canvas>
    <div class="hint">
      <span>マウス / タッチで動かして離すと落下</span>
      <span><kbd>←</kbd><kbd>→</kbd> 移動 <kbd>↑</kbd> 回す <kbd>Space</kbd> 落とす</span>
      <button class="ghost" id="rotateBtn">↻ 回す</button>
      <button class="ghost" id="muteBtn">音: ON</button>
      <button class="ghost" id="resetBtn">リセット</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const INK = '#3a2620';

  // ---- Drawing helpers (unit coordinates, scaled per snack) ----
  function fs(g, fill, stroke, lw) {
    g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
  }
  function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
  function gloss(g, x, y, rx, ry) {
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(x, y, rx, ry, -0.6, 0, TAU); g.fill();
  }
  function roundPoly(g, V, r) {
    const n = V.length;
    g.beginPath();
    g.moveTo((V[0][0] + V[n - 1][0]) / 2, (V[0][1] + V[n - 1][1]) / 2);
    for (let i = 0; i < n; i++) {
      const p = V[i], q = V[(i + 1) % n];
      g.arcTo(p[0], p[1], q[0], q[1], r);
    }
    g.closePath();
  }
  function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

  // ---- Snacks ----
  function drawStar(g, lw) {
    g.beginPath();
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU, rr = i % 2 ? 0.8 : 1;
      g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); fs(g, '#f7b6c8', '#c86f8f', lw);
    gloss(g, -0.3, -0.35, 0.25, 0.14);
  }
  function drawCandy(g, lw) {
    for (const k of [-1, 1]) {
      g.beginPath(); g.moveTo(k * 0.4, 0); g.lineTo(k, -0.42);
      g.quadraticCurveTo(k * 0.86, 0, k, 0.42); g.closePath();
      fs(g, '#ffd36e', '#c99a2a', lw);
    }
    circle(g, 0, 0, 0.56); fs(g, '#ff8a5c', '#c4532a', lw);
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 0.09;
    g.beginPath(); g.arc(0, 0, 0.36, -0.4, 2.2); g.stroke();
    gloss(g, -0.22, -0.26, 0.15, 0.08);
  }
  function drawTako(g, lw) {
    circle(g, 0, 0, 1); fs(g, '#c98a45', '#8a5520', lw);
    g.save(); circle(g, 0, 0, 0.98); g.clip();
    g.fillStyle = '#5a2c12'; g.beginPath(); g.ellipse(0, -0.45, 0.9, 0.45, 0, 0, TAU); g.fill();
    g.fillStyle = '#4c8a3a';
    for (let i = 0; i < 7; i++) g.fillRect(-0.6 + i * 0.19, -0.55 + (i % 3) * 0.1, 0.07, 0.07);
    g.strokeStyle = '#fff4c9'; g.lineWidth = 0.06;
    g.beginPath(); g.moveTo(-0.6, -0.5); g.lineTo(-0.2, -0.3); g.lineTo(0.2, -0.55); g.lineTo(0.6, -0.35); g.stroke();
    g.restore();
    gloss(g, -0.4, -0.15, 0.2, 0.1);
  }
  function drawDango(g, lw) {
    g.strokeStyle = '#d9b77a'; g.lineWidth = 0.1;
    g.beginPath(); g.moveTo(-0.95, 0); g.lineTo(1, 0); g.stroke();
    for (const [x, c, k] of [[-0.55, '#f6a9b8', '#c97888'], [0, '#fbf7ef', '#c9bfae'], [0.55, '#9cc77a', '#5f8f45']]) {
      circle(g, x, 0, 0.32); fs(g, c, k, lw);
      gloss(g, x - 0.12, -0.14, 0.09, 0.05);
    }
  }
  const ONIGIRI = [[0, -0.92], [0.92, 0.72], [-0.92, 0.72]];
  function drawOnigiri(g, lw) {
    roundPoly(g, ONIGIRI, 0.3); fs(g, '#fffaf0');
    g.save(); g.clip();
    g.fillStyle = '#1f2a22'; g.fillRect(-0.36, 0.32, 0.72, 0.6);
    g.restore();
    roundPoly(g, ONIGIRI, 0.3); g.strokeStyle = '#c9c0ae'; g.lineWidth = lw; g.stroke();
    circle(g, 0, -0.42, 0.09); fs(g, '#e66a6a');
  }
  function drawTaiyaki(g, lw) {
    g.beginPath(); g.moveTo(0.4, 0); g.lineTo(1, -0.48); g.quadraticCurveTo(0.86, 0, 1, 0.48); g.closePath();
    fs(g, '#d38b3c', '#8a5520', lw);
    g.beginPath(); g.ellipse(-0.15, 0, 0.75, 0.52, 0, 0, TAU); fs(g, '#d38b3c', '#8a5520', lw);
    g.strokeStyle = 'rgba(138,85,32,.55)'; g.lineWidth = 0.04;
    for (const x of [0.05, 0.25]) { g.beginPath(); g.arc(x, 0, 0.2, -1.1, 1.1); g.stroke(); }
    g.beginPath(); g.moveTo(-0.3, -0.5); g.quadraticCurveTo(0, -0.72, 0.3, -0.45); g.stroke();
    gloss(g, -0.5, -0.28, 0.16, 0.07);
  }
  function drawPan(g, lw) {
    const crust = () => { circle(g, -0.4, -0.45, 0.42); g.fill(); g.stroke(); circle(g, 0.4, -0.45, 0.42); g.fill(); g.stroke(); rrect(g, -0.78, -0.45, 1.56, 1.27, 0.12); g.fill(); g.stroke(); };
    g.fillStyle = '#c98a45'; g.strokeStyle = '#8a5520'; g.lineWidth = lw * 2; crust();
    g.fillStyle = '#c98a45'; circle(g, -0.4, -0.45, 0.42); g.fill(); circle(g, 0.4, -0.45, 0.42); g.fill(); rrect(g, -0.78, -0.45, 1.56, 1.27, 0.12); g.fill();
    g.fillStyle = '#fbf3dc';
    circle(g, -0.4, -0.45, 0.3); g.fill(); circle(g, 0.4, -0.45, 0.3); g.fill();
    rrect(g, -0.64, -0.42, 1.28, 1.1, 0.08); g.fill();
  }
  const PURIN = [[-0.52, -0.74], [0.52, -0.74], [0.88, 0.76], [-0.88, 0.76]];
  function drawPurin(g, lw) {
    roundPoly(g, PURIN, 0.12); fs(g, '#f7d77a');
    g.save(); g.clip(); g.fillStyle = '#8a4a1c'; g.fillRect(-1, -0.8, 2, 0.36);
    g.beginPath(); g.ellipse(-0.2, -0.44, 0.12, 0.1, 0, 0, TAU); g.ellipse(0.3, -0.44, 0.09, 0.14, 0, 0, TAU); g.fill();
    g.restore();
    roundPoly(g, PURIN, 0.12); g.strokeStyle = '#b8902a'; g.lineWidth = lw; g.stroke();
    g.strokeStyle = '#4c8a3a'; g.lineWidth = 0.04; g.beginPath(); g.moveTo(0, -0.95); g.quadraticCurveTo(0.05, -1.08, 0.16, -1.12); g.stroke();
    circle(g, 0, -0.84, 0.13); fs(g, '#e2333f', '#9a1c25', lw);
    gloss(g, -0.45, 0.1, 0.1, 0.22);
  }
  function drawDora(g, lw) {
    g.beginPath(); g.ellipse(0, 0, 1, 0.56, 0, 0, TAU); fs(g, '#b8692c');
    g.save(); g.clip();
    g.fillStyle = '#4a1f22'; g.fillRect(-1, -0.06, 2, 0.12);
    g.fillStyle = 'rgba(255,220,160,.25)'; g.beginPath(); g.ellipse(0, -0.3, 0.75, 0.18, 0, 0, TAU); g.fill();
    g.restore();
    g.beginPath(); g.ellipse(0, 0, 1, 0.56, 0, 0, TAU); g.strokeStyle = '#7a3e12'; g.lineWidth = lw; g.stroke();
  }
  function drawCastella(g, lw) {
    rrect(g, -1, -0.42, 2, 0.84, 0.1); fs(g, '#f7d168');
    g.save(); g.clip();
    g.fillStyle = '#7a3e12'; g.fillRect(-1, -0.42, 2, 0.15);
    g.fillStyle = '#f3ead9'; g.fillRect(-1, 0.31, 2, 0.11);
    g.restore();
    rrect(g, -1, -0.42, 2, 0.84, 0.1); g.strokeStyle = '#b8902a'; g.lineWidth = lw; g.stroke();
  }
  function drawCake(g, lw) {
    rrect(g, -0.95, -0.5, 1.9, 1.1, 0.14); fs(g, '#fff4f0');
    g.save(); g.clip();
    g.fillStyle = '#f2c46d'; g.fillRect(-1, 0.1, 2, 0.14);
    g.fillStyle = '#f6a0aa'; g.fillRect(-1, 0.24, 2, 0.07);
    g.fillStyle = '#f2c46d'; g.fillRect(-1, 0.31, 2, 0.14);
    g.restore();
    rrect(g, -0.95, -0.5, 1.9, 1.1, 0.14); g.strokeStyle = '#d7b3a8'; g.lineWidth = lw; g.stroke();
    for (let i = -2; i <= 2; i++) { circle(g, i * 0.36, -0.52, 0.11); fs(g, '#ffffff', '#d7b3a8', lw); }
    for (const x of [-0.54, 0, 0.54]) {
      g.beginPath(); g.moveTo(x - 0.12, -0.6); g.quadraticCurveTo(x, -0.86, x + 0.12, -0.6); g.closePath();
      fs(g, '#e2333f', '#9a1c25', lw);
    }
  }

  // parts: collision circles [x, y, r] in unit coords; face: [x, y, size]
  const LV = [
    { n: 'こんぺいとう', s: 13, draw: drawStar,     face: [0, 0.05, 0.95], parts: [[0, 0, 0.95]] },
    { n: 'あめ玉',       s: 21, draw: drawCandy,    face: [0, 0.03, 0.55], parts: [[0, 0, 0.56], [-0.8, 0, 0.3], [0.8, 0, 0.3]] },
    { n: 'たこ焼き',     s: 24, draw: drawTako,     face: [0, 0.2, 0.95],  parts: [[0, 0, 1]] },
    { n: '三色だんご',   s: 36, draw: drawDango,    face: [0, 0.03, 0.34], parts: [[-0.55, 0, 0.32], [0, 0, 0.32], [0.55, 0, 0.32], [0.9, 0, 0.08]] },
    { n: 'おにぎり',     s: 40, draw: drawOnigiri,  face: [0, 0.02, 0.7],  parts: [[0, -0.6, 0.32], [-0.6, 0.42, 0.3], [0.6, 0.42, 0.3], [0, 0.15, 0.5]] },
    { n: 'たい焼き',     s: 48, draw: drawTaiyaki,  face: [-0.45, 0.02, 0.5], parts: [[-0.42, 0, 0.48], [0.08, 0, 0.48], [0.72, 0, 0.28]] },
    { n: '食パン',       s: 54, draw: drawPan,      face: [0, 0.22, 0.7],  parts: [[-0.4, -0.45, 0.42], [0.4, -0.45, 0.42], [-0.42, 0.05, 0.4], [0.42, 0.05, 0.4], [-0.4, 0.44, 0.38], [0.4, 0.44, 0.38], [0, 0.25, 0.42]] },
    { n: 'プリン',       s: 60, draw: drawPurin,    face: [0, 0.25, 0.7],  parts: [[0, -0.42, 0.38], [-0.3, -0.5, 0.26], [0.3, -0.5, 0.26], [-0.48, 0.4, 0.38], [0.48, 0.4, 0.38], [0, 0.25, 0.48], [0, -0.84, 0.13]] },
    { n: 'どら焼き',     s: 72, draw: drawDora,     face: [0, 0.24, 0.6],  parts: [[-0.55, 0, 0.44], [0, 0, 0.56], [0.55, 0, 0.44]] },
    { n: 'カステラ',     s: 84, draw: drawCastella, face: [0, 0.07, 0.45], parts: [[-0.58, 0, 0.42], [-0.29, 0, 0.42], [0, 0, 0.42], [0.29, 0, 0.42], [0.58, 0, 0.42]] },
    { n: 'ホールケーキ', s: 96, draw: drawCake,     face: [0, -0.2, 0.55], parts: [[-0.42, 0.05, 0.55], [0.42, 0.05, 0.55], [0, 0, 0.58], [0, -0.62, 0.16]] },
  ];
  const MAX = LV.length - 1;
  for (const d of LV) {
    let A = 0, cx = 0, cy = 0;
    for (const [x, y, r] of d.parts) { const a = r * r; A += a; cx += x * a; cy += y * a; }
    d.cx = cx / A; d.cy = cy / A;
    d.P = d.parts.map(([x, y, r]) => ({ x: (x - d.cx) * d.s, y: (y - d.cy) * d.s, r: r * d.s }));
    d.m = d.P.reduce((m, p) => m + p.r * p.r, 0);
    d.I = d.P.reduce((I, p) => I + p.r * p.r * (p.r * p.r / 2 + p.x * p.x + p.y * p.y), 0);
    d.br = Math.max(...d.P.map(p => Math.hypot(p.x, p.y) + p.r));
  }

  // ---- World ----
  const W = 380, H = 560;
  const WALL = 14;
  const L = WALL, R = W - WALL, FLOOR = H - WALL;
  const DROP_Y = 48, DANGER_Y = 100;
  const G = 1700, MU = 0.45;

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const nextCv = document.getElementById('nextCanvas');
  const nctx = nextCv.getContext('2d');
  const chainCv = document.getElementById('chain');
  const cctx = chainCv.getContext('2d');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');

  let bodies, particles, popups, score, best = 0, cur, next, aimX, heldA, cooldown, dangerT, running, over, time, idSeq = 0, maxReached;

  try { best = +localStorage.getItem('otsukare-best') || 0; } catch (e) {}
  $best.textContent = best;

  function randLv() {
    const r = Math.random();
    return r < .3 ? 0 : r < .55 ? 1 : r < .78 ? 2 : r < .93 ? 3 : 4;
  }

  function makeBody(lvl, x, y, a) {
    const d = LV[lvl];
    const b = { id: idSeq++, lvl, x, y, a, vx: 0, vy: 0, w: 0, age: 0, pop: 0, m: d.m, I: d.I, br: d.br, wp: d.P.map(p => ({ x: 0, y: 0, r: p.r })) };
    place(b);
    return b;
  }
  function place(b) {
    const c = Math.cos(b.a), s = Math.sin(b.a), P = LV[b.lvl].P;
    for (let i = 0; i < P.length; i++) {
      b.wp[i].x = b.x + P[i].x * c - P[i].y * s;
      b.wp[i].y = b.y + P[i].x * s + P[i].y * c;
    }
  }
  function shift(b, dx, dy) {
    b.x += dx; b.y += dy;
    for (const p of b.wp) { p.x += dx; p.y += dy; }
  }

  function reset(state) {
    bodies = []; particles = []; popups = [];
    score = 0; cooldown = 0; dangerT = 0; time = 0; over = false; maxReached = 0;
    cur = randLv(); next = randLv(); aimX = W / 2; heldA = 0;
    if (state && state.bodies) {
      bodies = state.bodies.map(s => Object.assign(makeBody(s.lvl, s.x, s.y, s.a || 0), { vx: s.vx || 0, vy: s.vy || 0, w: s.w || 0, age: s.age || 2 }));
      score = state.score || 0; cur = state.cur ?? cur; next = state.next ?? next;
      maxReached = state.maxReached || 0;
    }
    updateHud();
  }

  function updateHud() {
    $score.textContent = score;
    if (score > best) {
      best = score; $best.textContent = best;
      try { localStorage.setItem('otsukare-best', best); } catch (e) {}
    }
    drawNext();
  }

  // ---- Sound ----
  let actx = null, muted = false;
  function blip(level) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const f = 260 * Math.pow(1.13, level);
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f * 1.5, actx.currentTime + .08);
      g.gain.setValueAtTime(.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .22);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + .25);
    } catch (e) {}
  }
  function thud() {
    if (muted || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, actx.currentTime);
      g.gain.setValueAtTime(.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .1);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .12);
    } catch (e) {}
  }

  // ---- Held snack ----
  function extents(lvl, a) {
    const c = Math.cos(a), s = Math.sin(a);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity;
    for (const p of LV[lvl].P) {
      const x = p.x * c - p.y * s, y = p.x * s + p.y * c;
      x0 = Math.min(x0, x - p.r); x1 = Math.max(x1, x + p.r); y0 = Math.min(y0, y - p.r);
    }
    return { x0, x1, y0 };
  }
  function heldPos() {
    const e = extents(cur, heldA);
    return { x: Math.max(L - e.x0, Math.min(R - e.x1, aimX)), y: Math.max(DROP_Y, 6 - e.y0) };
  }
  function rotate() { if (running && !over) heldA = (heldA + Math.PI / 4) % TAU; }

  function drop() {
    if (!running || over || cooldown > 0) return;
    const p = heldPos();
    const b = makeBody(cur, p.x, p.y, heldA);
    b.vy = 60;
    bodies.push(b);
    thud();
    cur = next; next = randLv(); heldA = 0;
    cooldown = .5;
    drawNext();
  }

  function merge(a, b) {
    a.dead = b.dead = true;
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    const lvl = a.lvl + 1;
    burst(x, y, '#ffcf6e', 10 + a.lvl * 2);
    blip(a.lvl);
    if (a.lvl === MAX) {
      score += 500;
      popups.push({ x, y, t: 0, s: '+500 ごちそうさま!' });
      return null;
    }
    const gain = (lvl * (lvl + 1)) / 2;
    score += gain;
    popups.push({ x, y, t: 0, s: '+' + gain });
    maxReached = Math.max(maxReached, lvl);
    const nb = makeBody(lvl, x, y, a.a);
    nb.vx = (a.vx + b.vx) / 2; nb.vy = (a.vy + b.vy) / 2 - 40; nb.w = (a.w + b.w) / 2;
    nb.age = 2; nb.pop = 1;
    return nb;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 80 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: .5 + Math.random() * .3, c: color, r: 2 + Math.random() * 3 });
    }
  }

  // ---- Rigid-body physics (each snack = a few circles glued together) ----
  function impulse(b, jx, jy, rx, ry) {
    b.vx += jx / b.m; b.vy += jy / b.m;
    b.w += (rx * jy - ry * jx) / b.I;
  }

  function contact(a, b, pa, pb) {
    const dx = pb.x - pa.x, dy = pb.y - pa.y, min = pa.r + pb.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= min * min) return;
    const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, pen = min - d;
    const cx = pa.x + nx * (pa.r - pen / 2), cy = pa.y + ny * (pa.r - pen / 2);
    const rax = cx - a.x, ray = cy - a.y, rbx = cx - b.x, rby = cy - b.y;
    const rvx = (b.vx - b.w * rby) - (a.vx - a.w * ray);
    const rvy = (b.vy + b.w * rbx) - (a.vy + a.w * rax);
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const e = vn < -150 ? 0.15 : 0;
      const ran = rax * ny - ray * nx, rbn = rbx * ny - rby * nx;
      const jn = -(1 + e) * vn / (1 / a.m + 1 / b.m + ran * ran / a.I + rbn * rbn / b.I);
      impulse(a, -jn * nx, -jn * ny, rax, ray); impulse(b, jn * nx, jn * ny, rbx, rby);
      const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
      const rat = rax * ty - ray * tx, rbt = rbx * ty - rby * tx;
      let jt = -vt / (1 / a.m + 1 / b.m + rat * rat / a.I + rbt * rbt / b.I);
      jt = Math.max(-MU * jn, Math.min(MU * jn, jt));
      impulse(a, -jt * tx, -jt * ty, rax, ray); impulse(b, jt * tx, jt * ty, rbx, rby);
    }
    const corr = Math.max(0, pen - 0.3) * 0.5, ia = 1 / a.m, ib = 1 / b.m, k = corr / (ia + ib);
    shift(a, -nx * k * ia, -ny * k * ia);
    shift(b, nx * k * ib, ny * k * ib);
  }

  function wallContact(b, p, nx, ny, pen) {
    const rx = p.x - nx * p.r - b.x, ry = p.y - ny * p.r - b.y;
    const vx = b.vx - b.w * ry, vy = b.vy + b.w * rx;
    const vn = vx * nx + vy * ny;
    if (vn < 0) {
      const e = vn < -150 ? 0.15 : 0;
      const rn = rx * ny - ry * nx;
      const jn = -(1 + e) * vn / (1 / b.m + rn * rn / b.I);
      impulse(b, jn * nx, jn * ny, rx, ry);
      const tx = -ny, ty = nx, vt = vx * tx + vy * ty, rt = rx * ty - ry * tx;
      let jt = -vt / (1 / b.m + rt * rt / b.I);
      jt = Math.max(-MU * jn, Math.min(MU * jn, jt));
      impulse(b, jt * tx, jt * ty, rx, ry);
    }
    shift(b, nx * pen, ny * pen);
  }

  function touching(a, b) {
    for (const pa of a.wp) for (const pb of b.wp) {
      const dx = pb.x - pa.x, dy = pb.y - pa.y, m = pa.r + pb.r + 1;
      if (dx * dx + dy * dy < m * m) return true;
    }
    return false;
  }

  function step(dt) {
    time += dt;
    if (cooldown > 0) cooldown -= dt;

    for (const b of bodies) {
      b.vy += G * dt;
      b.vx *= 0.999; b.vy *= 0.999; b.w *= 0.995;
      b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.w * dt;
      b.age += dt;
      if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 4);
      place(b);
    }

    const born = [];
    for (let it = 0; it < 6; it++) {
      for (let i = 0; i < bodies.length; i++) {
        const a = bodies[i];
        if (a.dead) continue;
        for (let j = i + 1; j < bodies.length; j++) {
          const b = bodies[j];
          if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y, reach = a.br + b.br + 1;
          if (dx * dx + dy * dy >= reach * reach) continue;
          if (a.lvl === b.lvl) {
            if (touching(a, b)) { const nb = merge(a, b); if (nb) born.push(nb); break; }
            continue;
          }
          for (const pa of a.wp) for (const pb of b.wp) contact(a, b, pa, pb);
        }
      }
      for (const b of bodies) {
        if (b.dead) continue;
        for (const p of b.wp) {
          if (p.x - p.r < L) wallContact(b, p, 1, 0, L - (p.x - p.r));
          if (p.x + p.r > R) wallContact(b, p, -1, 0, p.x + p.r - R);
          if (p.y + p.r > FLOOR) wallContact(b, p, 0, -1, p.y + p.r - FLOOR);
        }
      }
    }
    if (born.length || bodies.some(b => b.dead)) {
      bodies = bodies.filter(b => !b.dead).concat(born);
      updateHud();
    }

    const risky = bodies.some(b => b.age > 1.2 && b.wp.some(p => p.y - p.r < DANGER_Y));
    dangerT = risky ? dangerT + dt : Math.max(0, dangerT - dt * 2);
    if (dangerT > 2.5) gameOver();

    for (const p of particles) { p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    particles = particles.filter(p => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1);
  }

  function gameOver() {
    over = true; running = false;
    document.getElementById('finalScore').textContent = score;
    const msgs = [
      'こんぺいとうからやり直し。今日もよくがんばりました。',
      'いいペース。明日のシフトもこの調子で。',
      'なかなかの腕前。お茶でもいれて一息どうぞ。',
      'ケーキまであと少し。もう一回いけそう。',
      'ホールケーキ職人。今日の疲れはチャラです。',
    ];
    document.getElementById('overMsg').textContent = msgs[Math.min(4, Math.floor(maxReached / 2.2))];
    document.getElementById('overOverlay').hidden = false;
  }

  // ---- Rendering ----
  function face(g, x, y, k, px) {
    if (px < 6) return;
    const ey = y;
    g.fillStyle = INK;
    g.beginPath(); g.arc(x - 0.28 * k, ey, 0.085 * k, 0, TAU); g.arc(x + 0.28 * k, ey, 0.085 * k, 0, TAU); g.fill();
    g.strokeStyle = INK; g.lineWidth = Math.max(0.055 * k, 1.2 / (px / k));
    g.beginPath(); g.arc(x, ey + 0.08 * k, 0.13 * k, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
    g.fillStyle = 'rgba(255,110,110,.35)';
    g.beginPath(); g.arc(x - 0.47 * k, ey + 0.17 * k, 0.1 * k, 0, TAU); g.arc(x + 0.47 * k, ey + 0.17 * k, 0.1 * k, 0, TAU); g.fill();
  }

  // draws snack `lvl` centred on its centre of mass; px = pixels per unit
  function drawSnack(g, x, y, lvl, a = 0, px = LV[lvl].s, alpha = 1) {
    const d = LV[lvl];
    g.save();
    g.globalAlpha = alpha;
    g.translate(x, y); g.rotate(a); g.scale(px, px); g.translate(-d.cx, -d.cy);
    g.lineJoin = 'round'; g.lineCap = 'round';
    d.draw(g, Math.max(0.05, 1.6 / px));
    face(g, d.face[0], d.face[1], d.face[2], px * d.face[2]);
    g.restore();
  }

  function drawBox() {
    ctx.fillStyle = '#8e2a2a';
    ctx.beginPath(); ctx.roundRect(0, 0, W, H, 10); ctx.fill();
    ctx.fillStyle = '#5b1717';
    ctx.fillRect(L - 3, 0, R - L + 6, FLOOR + 3);
    const grd = ctx.createLinearGradient(0, 0, 0, FLOOR);
    grd.addColorStop(0, '#2c2944'); grd.addColorStop(1, '#3a3554');
    ctx.fillStyle = grd;
    ctx.fillRect(L, 0, R - L, FLOOR);
    ctx.strokeStyle = 'rgba(255,207,110,.55)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(L - 6, -2, R - L + 12, FLOOR + 8);
    const k = Math.min(1, dangerT / 2.5);
    ctx.save();
    ctx.setLineDash([8, 7]);
    ctx.strokeStyle = k > 0 ? `rgba(255,107,107,${0.45 + 0.55 * Math.abs(Math.sin(time * (6 + k * 10)))})` : 'rgba(255,107,107,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L, DANGER_Y); ctx.lineTo(R, DANGER_Y); ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawBox();

    if (running && !over) {
      const p = heldPos();
      ctx.strokeStyle = 'rgba(255,207,110,.25)'; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, FLOOR); ctx.stroke(); ctx.setLineDash([]);
      drawSnack(ctx, p.x, p.y, cur, heldA, LV[cur].s, cooldown > 0 ? 0.35 : 1);
    }

    ctx.save();
    ctx.beginPath(); ctx.rect(L, -200, R - L, FLOOR + 200); ctx.clip();
    for (const b of bodies) drawSnack(ctx, b.x, b.y, b.lvl, b.a, LV[b.lvl].s * (1 + b.pop * 0.18));
    ctx.restore();

    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '16px "Dela Gothic One", sans-serif'; ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t;
      ctx.fillStyle = '#ffcf6e';
      ctx.fillText(p.s, p.x, p.y - 20 - p.t * 40);
    }
    ctx.globalAlpha = 1;
  }

  function fitPx(lvl, radius) { const d = LV[lvl]; return d.s * radius / d.br; }

  function drawNext() {
    nctx.setTransform(1, 0, 0, 1, 0, 0);
    nctx.clearRect(0, 0, nextCv.width, nextCv.height);
    drawSnack(nctx, 44, 44, next, 0, fitPx(next, 26 + next * 3));
  }

  function drawChain() {
    const d = window.devicePixelRatio || 1;
    const w = chainCv.clientWidth, h = chainCv.clientHeight;
    chainCv.width = w * d; chainCv.height = h * d;
    cctx.setTransform(d, 0, 0, d, 0, 0);
    cctx.clearRect(0, 0, w, h);
    const n = LV.length, step = w / n;
    for (let i = 0; i < n; i++) {
      const r = Math.min(step * 0.42, 6 + (i / MAX) * 10);
      drawSnack(cctx, step * (i + 0.5), h / 2, i, 0, fitPx(i, r));
      if (i < n - 1) {
        cctx.fillStyle = 'rgba(169,162,194,.6)';
        cctx.beginPath(); cctx.arc(step * (i + 1), h / 2, 1.3, 0, TAU); cctx.fill();
      }
    }
  }

  // ---- Sizing ----
  let scale = 1, dpr = 1;
  const stage = document.getElementById('stage');
  function resize() {
    dpr = window.devicePixelRatio || 1;
    const aw = stage.clientWidth, ah = stage.clientHeight;
    scale = Math.max(0.3, Math.min(aw / W, ah / H));
    cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    drawChain();
  }
  window.addEventListener('resize', resize);

  // ---- Input ----
  function toWorld(e) { const rc = cv.getBoundingClientRect(); return (e.clientX - rc.left) / scale; }
  cv.addEventListener('pointermove', e => { aimX = toWorld(e); });
  cv.addEventListener('pointerdown', e => { aimX = toWorld(e); if (e.pointerType !== 'mouse') cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', e => { if (e.button === 2) return; aimX = toWorld(e); drop(); });
  cv.addEventListener('contextmenu', e => { e.preventDefault(); rotate(); });
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'ArrowUp' || e.key === 'z' || e.key === 'x') { rotate(); e.preventDefault(); }
    if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') {
      if (!running && !over && !document.getElementById('startOverlay').hidden) { start(); }
      else if (over) { restart(); }
      else drop();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function start() {
    document.getElementById('startOverlay').hidden = true;
    running = true;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  function restart() {
    document.getElementById('overOverlay').hidden = true;
    reset(); running = true;
  }
  document.getElementById('startBtn').onclick = start;
  document.getElementById('retryBtn').onclick = restart;
  document.getElementById('resetBtn').onclick = () => { document.getElementById('startOverlay').hidden = true; restart(); };
  document.getElementById('rotateBtn').onclick = rotate;
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '音: OFF' : '音: ON'; };

  // ---- Loop ----
  let last = performance.now(), acc = 0;
  const FIXED = 1 / 120;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (keys.ArrowLeft) aimX = heldPos().x - 320 * dt;
    if (keys.ArrowRight) aimX = heldPos().x + 320 * dt;
    if (running && !over) {
      acc += dt;
      while (acc >= FIXED) { step(FIXED); acc -= FIXED; }
    } else {
      time += dt;
    }
    render();
    requestAnimationFrame(loop);
  }

  function boot(saved) {
    reset(saved);
    if (saved && saved.bodies && saved.bodies.length && !saved.over) {
      document.getElementById('startOverlay').hidden = true;
      running = true;
    }
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawChain(); drawNext(); });
    requestAnimationFrame(loop);
  }

  window.claude?.hot?.snapshot?.(() => ({
    bodies: bodies.map(({ x, y, a, vx, vy, w, lvl, age }) => ({ x, y, a, vx, vy, w, lvl, age })),
    score, cur, next, maxReached, over,
  }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
